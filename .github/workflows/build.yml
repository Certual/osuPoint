name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release title (optional, defaults to tag)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CFLAGS_COMMON: '/nologo /O2 /Ot /Oi /Ob3 /GL /Gy /Gw /Oy /cgthreads1 /Brepro /Zc:inline /Zc:threadSafeInit- /Zc:tlsGuards- /Zc:nrvo /jumptablerdata /presetPadding- /favor:blend /guard:cf- /volatile:iso /std:c++20 /fp:fast /fp:except- /Gv /GA /Qfast_transcendentals /Qspectre- /sdl- /DNDEBUG /D_HAS_EXCEPTIONS=0 /D_DISABLE_VECTOR_ANNOTATION /D_ITERATOR_DEBUG_LEVEL=0 /GS- /GR- /EHs- /EHc- /EHa- /MT /utf-8 /W4 /WX /I . /I src'
      LFLAGS: '/link /SUBSYSTEM:WINDOWS /LTCG /OPT:REF /OPT:ICF /MERGE:.rdata=.text /GUARD:NO /CETCOMPAT:NO /DYNAMICBASE:NO /HIGHENTROPYVA:NO /INCREMENTAL:NO /FILEALIGN:4096 /STACK:0x100000,0x100000 /HEAP:0x100000,0x100000 gdiplus.lib comdlg32.lib /DEBUG:NONE /RELEASE'
      SRCS_COMMON: 'src\platform.cpp src\tablet_decoder.cpp src\driver_pipeline.cpp src\config_manager.cpp src\ui_view.cpp src\osuPoint.cpp src\osuPoint.res'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 1. Build Developer binary and run diagnostics test
      - name: Run Selftest
        shell: cmd
        run: |
          cl.exe %CFLAGS_COMMON% /DENABLE_SELFTEST=1 /Fe:osuPoint-dev.exe %SRCS_COMMON% src\selftest.cpp %LFLAGS%
          .\osuPoint-dev.exe --selftest

      # 2. Build standard non-AVX (SSE2 Baseline) binary
      - name: Build Standard
        shell: cmd
        run: |
          cl.exe %CFLAGS_COMMON% /Fe:osuPoint.exe %SRCS_COMMON% %LFLAGS%
          mkdir dist-standard
          move osuPoint.exe dist-standard\

      # 3. Build AVX2 optimized binary
      - name: Build AVX2
        shell: cmd
        run: |
          cl.exe %CFLAGS_COMMON% /arch:AVX2 /Fe:osuPoint.exe %SRCS_COMMON% %LFLAGS%
          mkdir dist-avx2
          move osuPoint.exe dist-avx2\

      # 4. Create ZIP archives without version/arch suffixes
      - name: Create ZIP archives
        shell: pwsh
        run: |
          Compress-Archive -Path dist-standard\* -DestinationPath "osuPoint.zip"
          Compress-Archive -Path dist-avx2\* -DestinationPath "osuPoint-avx2.zip"

      # 5. Create GitHub Release and upload assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_title != '' && inputs.release_title || inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            osuPoint.zip
            osuPoint-avx2.zip
