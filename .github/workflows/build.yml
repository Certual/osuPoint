name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.6.0). Leave empty to only build and test.'
        required: false
        default: ''
      release_title:
        description: 'Release title (optional, defaults to tag)'
        required: false
        default: ''
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build All Targets
        shell: cmd
        run: call build.bat ALL

      - name: Run Hardware Golden Vectors Selftest
        shell: pwsh
        run: .\osuPoint-dev.exe --selftest

      - name: Package Release Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/sse, dist/avx, dist/avx2 -Force | Out-Null

          Copy-Item osuPoint-sse.exe dist/sse/osuPoint.exe
          Compress-Archive -Path dist/sse/* -DestinationPath osuPoint-sse.zip -Force

          Copy-Item osuPoint-avx.exe dist/avx/osuPoint.exe
          Compress-Archive -Path dist/avx/* -DestinationPath osuPoint-avx.zip -Force

          Copy-Item osuPoint.exe dist/avx2/osuPoint.exe
          Compress-Archive -Path dist/avx2/* -DestinationPath osuPoint-avx2.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osuPoint-binaries
          path: |
            osuPoint-sse.zip
            osuPoint-avx.zip
            osuPoint-avx2.zip
            osuPoint.exe
            osuPoint-avx.exe
            osuPoint-sse.exe
            osuPoint-dev.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') && inputs.tag_name || github.ref_name }}
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_title != '') && inputs.release_title || github.ref_name }}
          files: |
            osuPoint-sse.zip
            osuPoint-avx.zip
            osuPoint-avx2.zip
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || (contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
